<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoardForge · 桌游工坊</title>
  <link rel="stylesheet" href="style.css?v=29">
</head>
<body>
  <div id="app">
    <!-- 登录注册页 -->
    <section id="view-auth" class="view active">
      <div class="auth-card">
        <h1 class="logo">BoardForge</h1>
        <p class="tag">朋友间的桌游工坊</p>
        <div class="auth-tabs">
          <button class="tab-btn active" data-tab="login">登录</button>
          <button class="tab-btn" data-tab="register">注册</button>
        </div>
        <form id="form-login" class="auth-form active">
          <input type="text" id="login-user" placeholder="账号" autocomplete="username" required>
          <input type="password" id="login-pass" placeholder="密码" autocomplete="current-password" required>
          <button type="submit" class="btn-primary">登录</button>
        </form>
        <form id="form-register" class="auth-form">
          <input type="text" id="reg-user" placeholder="账号（3-16位字母数字下划线）" autocomplete="username" required>
          <input type="password" id="reg-pass" placeholder="密码（6-64位）" autocomplete="new-password" required>
          <button type="submit" class="btn-primary">注册并登录</button>
        </form>
        <p id="auth-msg" class="msg"></p>
      </div>
    </section>

    <!-- 大厅页 -->
    <section id="view-lobby" class="view">
      <header class="lobby-header">
        <div class="logo-sm">BoardForge</div>
        <div class="user-info">
          <span id="username">—</span>
          <button id="btn-logout" class="btn-ghost">退出</button>
        </div>
      </header>

      <main class="lobby-main">
        <div class="games-grid">
          <div class="game-card locked" data-game="splendor">
            <div class="game-cover splendor-cover">💎</div>
            <div class="game-meta">
              <h3>璀璨宝石</h3>
              <p class="game-desc">文艺复兴富商经营 · 2-4人 · 30分钟</p>
              <span class="game-badge">基础版 ✅ 可玩</span>
            </div>
          </div>
          <div class="game-card coming-soon">
            <div class="game-cover">🗺️</div>
            <div class="game-meta">
              <h3>卡坦岛</h3>
              <p class="game-desc">资源贸易 · 3-4人</p>
              <span class="game-badge soon">敬请期待</span>
            </div>
          </div>
          <div class="game-card coming-soon">
            <div class="game-cover">🚂</div>
            <div class="game-meta">
              <h3>铁路环游</h3>
              <p class="game-desc">连接大陆 · 2-5人</p>
              <span class="game-badge soon">敬请期待</span>
            </div>
          </div>
          <div class="game-card coming-soon">
            <div class="game-cover">🏨</div>
            <div class="game-meta">
              <h3>奥地利大饭店</h3>
              <p class="game-desc">酒店管理 · 2-4人</p>
              <span class="game-badge soon">敬请期待</span>
            </div>
          </div>
        </div>
      </main>
    </section>

    <!-- 房间页 -->
    <section id="view-room" class="view">
      <header class="lobby-header">
        <button id="btn-room-back" class="btn-ghost">← 返回大厅</button>
        <div class="user-info"><span id="room-title">房间</span></div>
        <button id="btn-rules" class="btn-ghost">📖 规则</button>
      </header>
      <main class="room-main">
        <!-- 等待开始（多人还没齐） -->
        <div id="room-waiting" class="room-waiting hidden">
          <div class="waiting-card">
            <h2>⚙️ 房间准备</h2>
            <p class="waiting-sub">当前在线 <span id="room-online-count">1</span> 人</p>
            <div id="room-players-list" class="room-players-list"></div>
            <div class="waiting-actions">
              <label class="ai-toggle">
                <input type="checkbox" id="toggle-ai" checked> 开启 AI 补位（剩余座位 AI 占）
              </label>
              <label class="players-picker">
                AI 数量：
                <select id="ai-count">
                  <option value="1">1 个 AI</option>
                  <option value="2" selected>2 个 AI</option>
                  <option value="3">3 个 AI</option>
                </select>
              </label>
            </div>
            <button id="btn-start-game" class="btn-primary">🚀 开始游戏</button>
            <p id="room-share-box" class="share-box"></p>
          </div>
        </div>

        <!-- 游戏中 -->
        <div id="splendor-game" class="splendor-game hidden">
          <!-- 左：行动记录 -->
          <div class="splendor-log" id="splendor-log"></div>

          <!-- 上：玩家3（或2人时不显示） -->
          <div class="splendor-side splendor-top" id="splendor-side-top"></div>

          <!-- 左：玩家2 -->
          <div class="splendor-side splendor-left" id="splendor-side-left"></div>

          <!-- 中央：游戏桌 -->
          <div class="splendor-center">
            <!-- 贵族 -->
            <div class="splendor-nobles-row" id="splendor-nobles"></div>
            <!-- 三级卡 -->
            <div class="splendor-tiers">
              <div class="splendor-tier" data-tier="3" id="splendor-tier-3"></div>
              <div class="splendor-tier" data-tier="2" id="splendor-tier-2"></div>
              <div class="splendor-tier" data-tier="1" id="splendor-tier-1"></div>
            </div>
            <!-- 宝石堆 -->
            <div id="splendor-gems" class="splendor-gems"></div>
          </div>

          <!-- 右：玩家4（或3人时） -->
          <div class="splendor-side splendor-right" id="splendor-side-right"></div>

          <!-- 下：我（自己的手牌 + 动作区） -->
          <div class="splendor-side splendor-bottom" id="splendor-side-bottom"></div>
        </div>

        <!-- 游戏结束 -->
        <div id="splendor-end" class="hidden">
          <div class="end-card">
            <h2>🏆 游戏结束</h2>
            <div id="splendor-scores"></div>
            <button id="btn-new-game" class="btn-primary">再来一局</button>
          </div>
        </div>
      </main>
    </section>

    <!-- Admin 牌库编辑器 -->
    <section id="view-admin" class="view">
      <main class="container" id="admin-root"></main>
    </section>
  </div>

  <script type="module" src="js/app.js?v=25"></script>
</body>
</html>
